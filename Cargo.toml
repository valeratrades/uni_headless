cargo-features = ["codegen-backend"]
[package]
name = "uni_headless"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/valeratrades/uni_headless"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[features]
default = ["xdg"]
xdg = ["v_utils/xdg"]

[dependencies]
ask_llm = { version = "^3.0.1" }
base64 = "0.22"
chromiumoxide = { version = "0.8", features = ["tokio-runtime"] }
chrono = "0.4.44"
clap = { version = "4", features = ["derive"] }
color-eyre = "^0.6.5"
derive-new = "^0"
futures = "0.3"
libc = "0.2.182"
miette = "7.6.0"
rand = "0.10"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
v_utils = { version = "2.15.29", features = ["cli", "async-io"] }

[lints.clippy]
# Stable
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow" # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"

# Questionable
# const fns, so actually more performant
get_first = "allow"
get_last_with_len = "allow"
if_not_else = "warn"
integer_division = "warn"

[lints.rust]
stable_features = "allow"
unused_features = "allow"

[lints.cargo]
non_kebab_case_bins = "allow"
